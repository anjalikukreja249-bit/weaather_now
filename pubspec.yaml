name: weather_now
description: A Flutter weather app with Clean Architecture and Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Local storage
  shared_preferences: ^2.2.3

  # Date formatting
  intl: ^0.19.0

  # Image caching (prevents redundant network fetches for weather icons)
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
